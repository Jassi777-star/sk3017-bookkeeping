{% extends "base.html" %}
{% block title %}{{ heading }} | 个人记账本{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <p class="eyebrow">收支记录</p>
    <h1>{{ heading }}</h1>
  </div>
</section>

<section class="panel form-panel">
  <form method="post" action="{{ action }}" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <label>
        收支类型
        <select name="type">
          <option value="expense" {% if form.type == "expense" %}selected{% endif %}>支出</option>
          <option value="income" {% if form.type == "income" %}selected{% endif %}>收入</option>
        </select>
        {% if errors.type %}<span class="field-error">{{ errors.type }}</span>{% endif %}
      </label>
      <label>
        分类
        <select name="category_id" required>
          <option value="">请选择</option>
          {% for category in categories %}
            <option value="{{ category.id }}" {% if form.category_id|string == category.id|string %}selected{% endif %}>
              {{ "收入" if category.type == "income" else "支出" }} · {{ category.name }}
            </option>
          {% endfor %}
        </select>
        {% if errors.category_id %}<span class="field-error">{{ errors.category_id }}</span>{% endif %}
      </label>
      <label>
        金额
        <input name="amount" inputmode="decimal" value="{{ form.amount }}" placeholder="0.00" required>
        {% if errors.amount %}<span class="field-error">{{ errors.amount }}</span>{% endif %}
      </label>
      <label>
        日期
        <input type="date" name="occurred_on" value="{{ form.occurred_on }}" required>
        {% if errors.occurred_on %}<span class="field-error">{{ errors.occurred_on }}</span>{% endif %}
      </label>
    </div>
    <label>
      备注
      <textarea name="note" maxlength="255" rows="3" placeholder="可选">{{ form.note }}</textarea>
      {% if errors.note %}<span class="field-error">{{ errors.note }}</span>{% endif %}
    </label>
    <div class="form-actions">
      <button type="submit">保存交易</button>
      <a class="text-link" href="{{ url_for('entries.entries') }}">取消</a>
    </div>
  </form>
</section>
{% endblock %}
